[versions]
# Pinned deliberately. Gradle 8.11.1 is reused from the existing TWA project's
# wrapper cache, so no fresh distribution download is needed.
#   AGP 8.10.x  <- officially supports compileSdk 36 AND runs on Gradle 8.11.1
#                  (AGP 8.11+ would require Gradle 8.13)
agp = "8.10.1"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"           # must track `kotlin` exactly; Hilt runs through it
coreKtx = "1.16.0"
lifecycle = "2.9.0"
activityCompose = "1.10.1"
composeBom = "2025.05.01"
hilt = "2.56.2"
# One version for every androidx.hilt artifact. They share a generated
# API surface, and 1.4.0 expects a newer Dagger than 2.56.2 -- mixing
# them fails with a missing getSavedStateHandleHolder().
androidxHilt = "1.3.0"
desugar = "2.1.5"

# B3 — the photo half of the four-step flow.
camerax = "1.6.1"

# B4 -- the offline layer. The queue is the app's memory when there is
# no signal, so these are load-bearing, not conveniences.
exif = "1.4.1"
room = "2.8.4"
work = "2.11.2"
coil = "3.2.0"

# Phase 2 -- location verification (migrations 0068/0069).
# FusedLocationProviderClient rather than the framework LocationManager:
# getCurrentLocation() asks for a FRESH fix, where getLastKnownLocation()
# happily returns an hours-old one. A stale fix is the dangerous failure
# here -- a location captured at home this morning would verify a worker
# onto a site they are not standing on.
playServicesLocation = "21.3.0"

# B2 — the app first talks to Supabase here.
# supabase-kt 3.1.4 is the newest STABLE (3.2.0 is still rc/beta at time of
# writing); ktor 3.1.3 is the client engine it is built against.
supabase = "3.1.4"
ktor = "3.1.3"
serialization = "1.8.0"
multiplatformSettings = "1.3.0" # backs the supabase session store
securityCrypto = "1.1.0"        # EncryptedSharedPreferences — 1.1.0 is stable now

junit = "4.13.2"
coroutines = "1.10.1"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                 version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { group = "androidx.activity",         name = "activity-compose",         version.ref = "activityCompose" }

androidx-compose-bom        = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
androidx-ui                 = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics        = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling         = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons     = { group = "androidx.compose.material",  name = "material-icons-extended" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

hilt-android                = { group = "com.google.dagger",         name = "hilt-android",             version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",         name = "hilt-android-compiler",    version.ref = "hilt" }
hilt-viewmodel-compose      = { group = "androidx.hilt",             name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# supabase-kt: the BOM aligns auth/postgrest/storage, so the modules carry no version.
supabase-bom                = { group = "io.github.jan-tennert.supabase", name = "bom",                 version.ref = "supabase" }
supabase-auth               = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest          = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-storage            = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
ktor-client-okhttp          = { group = "io.ktor",                   name = "ktor-client-okhttp",       version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor",               name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json     = { group = "io.ktor",                   name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "serialization" }
multiplatform-settings      = { group = "com.russhwolf",             name = "multiplatform-settings",   version.ref = "multiplatformSettings" }
androidx-security-crypto    = { group = "androidx.security",         name = "security-crypto",          version.ref = "securityCrypto" }

androidx-camera-core        = { group = "androidx.camera",           name = "camera-core",              version.ref = "camerax" }
androidx-camera-camera2     = { group = "androidx.camera",           name = "camera-camera2",           version.ref = "camerax" }
androidx-camera-lifecycle   = { group = "androidx.camera",           name = "camera-lifecycle",         version.ref = "camerax" }
androidx-camera-view        = { group = "androidx.camera",           name = "camera-view",              version.ref = "camerax" }
coil-compose                = { group = "io.coil-kt.coil3",          name = "coil-compose",             version.ref = "coil" }
coil-network-okhttp         = { group = "io.coil-kt.coil3",          name = "coil-network-okhttp",      version.ref = "coil" }
play-services-location      = { group = "com.google.android.gms",   name = "play-services-location",   version.ref = "playServicesLocation" }

androidx-exifinterface      = { group = "androidx.exifinterface",    name = "exifinterface",            version.ref = "exif" }
androidx-room-runtime       = { group = "androidx.room",             name = "room-runtime",             version.ref = "room" }
androidx-room-ktx           = { group = "androidx.room",             name = "room-ktx",                 version.ref = "room" }
androidx-room-compiler      = { group = "androidx.room",             name = "room-compiler",            version.ref = "room" }
androidx-work-runtime       = { group = "androidx.work",             name = "work-runtime-ktx",         version.ref = "work" }
androidx-hilt-work          = { group = "androidx.hilt",             name = "hilt-work",                version.ref = "androidxHilt" }
androidx-hilt-compiler      = { group = "androidx.hilt",             name = "hilt-compiler",            version.ref = "androidxHilt" }

# java.time on minSdk 24 — workers are on cheap, old phones.
desugar-jdk-libs            = { group = "com.android.tools",         name = "desugar_jdk_libs",         version.ref = "desugar" }

junit                       = { group = "junit",                     name = "junit",                    version.ref = "junit" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",  version.ref = "coroutines" }
androidx-junit              = { group = "androidx.test.ext",         name = "junit",                    version.ref = "androidxJunit" }
androidx-espresso-core      = { group = "androidx.test.espresso",    name = "espresso-core",            version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
